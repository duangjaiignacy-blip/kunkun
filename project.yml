name: KUNTranslator
options:
  bundleIdPrefix: com.kun
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_TESTABILITY: YES
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "KUN Translator Local Signing"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    ENABLE_DEBUG_DYLIB: "NO"
targets:
  KUNTranslator:
    type: application
    platform: macOS
    sources:
      - path: KUNTranslator/App
      - path: KUNTranslator/Core
      - path: KUNTranslator/Features
      - path: KUNTranslator/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kun.translator
        PRODUCT_NAME: KUNTranslator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: KUNTranslator/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: KUNTranslator/KUNTranslator.entitlements
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: Carbon.framework
      - sdk: Vision.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: AVFoundation.framework
      - sdk: NaturalLanguage.framework
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
  KUNTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KUNTranslatorTests
      - path: KUNTranslator/Core
      - path: KUNTranslator/Features/AI
      - path: KUNTranslator/Features/Hotkey
      - path: KUNTranslator/Features/Translation/TranslationEngine.swift
    dependencies:
      - sdk: Carbon.framework
      - sdk: NaturalLanguage.framework
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kun.translator.tests
        PRODUCT_NAME: KUNTranslatorTests
        PRODUCT_MODULE_NAME: KUNTranslatorTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  KUNTranslator:
    build:
      targets:
        KUNTranslator: all
        KUNTranslatorTests: [test]
    test:
      targets:
        - KUNTranslatorTests
